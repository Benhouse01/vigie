<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vigie">
  <title>Vigie</title>
  <!--
    LE PICTOGRAMME DE VIGIE : un oeil.

    La lentille est faite de DEUX ARCS DE CERCLE qui se rejoignent en pointe, jamais d'une
    ellipse : une ellipse donne un oeil rond et mou, deux arcs donnent la forme que tout
    le monde lit comme un oeil, y compris a seize pixels.
    Corde a = 21,44 et fleche h = 11,2 donnent R = (a² + h²) / 2h = 26,12.

    La pupille est un TROU, obtenu par fill-rule evenodd : elle laisse revoir le degrade
    de la tuile, ce qui evite une troisieme couleur.

    La geometrie est la meme que celle de marque/generer.py, qui produit les PNG et l'ICO.
    Changer l'une sans l'autre ferait deriver le favicon du logo.
  -->
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eb6834"/>
      <stop offset="1" stop-color="#2a78d6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#v)"/>
  <path fill="#faf9f6" fill-rule="evenodd"
        d="M10.56 32 A26.12 26.12 0 0 1 53.44 32 A26.12 26.12 0 0 1 10.56 32 Z
           M38.72 32 A6.72 6.72 0 1 0 25.28 32 A6.72 6.72 0 1 0 38.72 32 Z"/>
</svg>
