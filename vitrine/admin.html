<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vigie — qui se sert de l'outil</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:light;--fond:#f7f7f5;--carte:#fff;--carte2:#fbfbf9;--bord:#e4e2dc;--bord-fort:#cfccc4;
  --texte:#14140f;--texte2:#54524b;--doux:#7b786f;--accent:#eb6834;--bleu:#2a78d6;--ok:#116b40;
  --attention:#7d6110}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --fond:#131316;--carte:#1b1b1f;--carte2:#202025;--bord:#2f2f36;--bord-fort:#43434c;--texte:#f2f1ee;
  --texte2:#b9b7b0;--doux:#8d8a83;--accent:#d95926;--bleu:#3987e5;--ok:#4cc389;--attention:#d8b755}}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);
  font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.env{max-width:1180px;margin:0 auto;padding:28px 22px 70px}
h1{font-size:26px;letter-spacing:-.8px;margin:0 0 4px}
.sous{color:var(--doux);margin:0 0 26px;font-size:14px}
h2{font-size:17px;letter-spacing:-.3px;margin:34px 0 12px}
.chiffres{display:flex;gap:26px;flex-wrap:wrap;background:var(--carte);border:1px solid var(--bord);
  border-radius:12px;padding:18px 22px}
.c .n{font-size:29px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.c .l{color:var(--doux);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:640}
.bloc{background:var(--carte);border:1px solid var(--bord);border-radius:12px;overflow:hidden}
.tab{overflow:auto;max-height:440px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--carte2);text-align:left;padding:9px 13px;
  border-bottom:1px solid var(--bord-fort);color:var(--doux);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;white-space:nowrap}
td{padding:8px 13px;border-bottom:1px solid var(--bord);vertical-align:top}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:var(--carte2)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--texte2)}
.msg{padding:40px 20px;text-align:center;color:var(--texte2)}
a{color:var(--bleu)}
.et{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:640;
  background:var(--carte2);border:1px solid var(--bord-fort);color:var(--texte2)}
</style>
<link rel="icon" href="/marque.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#eb6834">
</head>
<body>
<div class="env" id="app"><p class="msg">Lecture…</p></div>

<script>
(function(){
"use strict";
var app = document.getElementById('app');

function ech(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
var nb = function(n){ return (n == null) ? '—' : Number(n).toLocaleString('fr-FR'); };
var quand = function(s){ return String(s || '').replace('T',' ').slice(0,16); };

function tableau(titre, entetes, lignes, rendu){
  var corps = (lignes || []).map(rendu).join('');
  return '<h2>' + ech(titre) + '</h2><div class="bloc"><div class="tab"><table><thead><tr>' +
    entetes.map(function(e){ return '<th' + (e[1] ? ' style="text-align:right"' : '') + '>' + ech(e[0]) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + (corps || '<tr><td colspan="' + entetes.length + '" class="msg">rien encore</td></tr>') +
    '</tbody></table></div></div>';
}

fetch('/api/admin', { credentials:'same-origin' }).then(function(r){
  return r.json().then(function(d){ return { ok:r.ok, statut:r.status, d:d }; });
}).then(function(x){
  if (!x.ok){
    app.innerHTML = '<p class="msg">' + ech(x.d.erreur || 'refusé') +
      ' — <a href="/">revenir à l\'outil</a></p>';
    return;
  }
  var d = x.d;
  var actions = {};
  (d.actions_24h || []).forEach(function(a){ actions[a.action] = a.n; });

  var h = '<h1>Qui se sert de Vigie</h1>' +
    '<p class="sous">Lecture directe de la base partagée. <a href="/">revenir à l\'outil</a></p>' +
    '<div class="chiffres">' +
      '<div class="c"><div class="n">' + nb(d.total_comptes) + '</div><div class="l">comptes</div></div>' +
      '<div class="c"><div class="n">' + nb(actions.analyse || 0) + '</div><div class="l">analyses 24 h</div></div>' +
      '<div class="c"><div class="n">' + nb(actions.crawl || 0) + '</div><div class="l">crawls 24 h</div></div>' +
      '<div class="c"><div class="n">' + nb(actions.inscription || 0) + '</div><div class="l">inscrits 24 h</div></div>' +
      '<div class="c"><div class="n">' + nb(d.index && d.index.liens) + '</div><div class="l">liens en index</div></div>' +
      '<div class="c"><div class="n">' + nb(d.index && d.index.cibles) + '</div><div class="l">domaines suivis</div></div>' +
      '<div class="c"><div class="n">' + nb(d.index && d.index.domaines) + '</div><div class="l">référents distincts</div></div>' +
    '</div>';

  h += tableau('Les comptes', [['Email'],['Créé'],['Vu'],['Analyses',1],['Crawls',1],['Pays']],
    d.comptes, function(c){
      return '<tr><td>' + ech(c.email) + '</td><td class="mono">' + quand(c.cree_le) + '</td>' +
        '<td class="mono">' + quand(c.vu_le) + '</td><td class="num">' + nb(c.analyses) + '</td>' +
        '<td class="num">' + nb(c.crawls) + '</td><td>' + ech(c.pays || '') + '</td></tr>';
    });

  h += tableau('La file du robot', [['Domaine'],['État'],['Où il en est'],['Pages',1],['Liens',1],['Demandé']],
    d.file_robot, function(l){
      return '<tr><td><b>' + ech(l.cible) + '</b></td><td><span class="et">' + ech(l.etat) + '</span></td>' +
        '<td>' + ech(l.phase_msg || '') + '</td><td class="num">' + nb(l.pages_lues) + '</td>' +
        '<td class="num">' + nb(l.liens_trouves) + '</td><td class="mono">' + quand(l.demande_le) + '</td></tr>';
    });

  h += tableau('Ce que le robot a rapporté, par source', [['Source du candidat'],['Liens confirmés',1]],
    d.rendement_par_source, function(s){
      return '<tr><td>' + ech(s.source_donnee) + '</td><td class="num">' + nb(s.n) + '</td></tr>';
    });

  h += tableau('Domaines les plus demandés, sept jours', [['Domaine'],['Demandes',1]],
    d.domaines_demandes_7j, function(t){
      return '<tr><td>' + ech(t.cible) + '</td><td class="num">' + nb(t.n) + '</td></tr>';
    });

  h += tableau('Le journal, deux cents dernières actions', [['Quand'],['Qui'],['Quoi'],['Sur'],['Pays']],
    d.recents, function(u){
      return '<tr><td class="mono">' + quand(u.quand) + '</td><td>' + ech(u.email || '') + '</td>' +
        '<td><span class="et">' + ech(u.action) + '</span></td><td>' + ech(u.cible || '') + '</td>' +
        '<td>' + ech(u.pays || '') + '</td></tr>';
    });

  app.innerHTML = h;
}).catch(function(){
  app.innerHTML = '<p class="msg">La lecture a échoué.</p>';
});
})();
</script>
</body>
</html>
